type User @table {
    id: String! @default(expr: "auth.uid")
    email: String! @unique
    displayName: String!
    role: String! # "admin" | "member"
    createdAt: Timestamp!
}

type Task @table {
    title: String!
    description: String
    status: String! # "todo" | "in-progress" | "done"
    priority: String! # "low" | "medium" | "high"
    dueDate: Date
    assignedTo: User!
    createdBy: User!
    createdAt: Timestamp!
}
